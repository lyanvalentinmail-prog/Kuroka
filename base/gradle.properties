# Gradle: parallel, cached builds with a bounded daemon (fits a laptop and a CI runner).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.vfs.watch=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# AniList sign-in (Settings, Account): a client id/secret of your own from
# https://anilist.co/settings/developer makes the OAuth button appear. Without them the app still
# signs in with a personal access token, and everything else works with no account at all.
# Give them on the command line (-PanilistClientId=…) or in ~/.gradle/gradle.properties.
anilistClientId=
anilistRedirectUri=kuroka://anilist/callback
